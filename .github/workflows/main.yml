name: Build LIFE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создать Android проект LIFE
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/timur/life
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cp MainActivity.kt app/src/main/java/com/timur/life/MainActivity.kt
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp index.html app/src/main/assets/index.html
          cp ic_life.xml app/src/main/res/drawable/ic_life.xml
          cp styles.xml app/src/main/res/values/styles.xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LIFE"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.timur.life"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.timur.life"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          EOF

      - name: Создать Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Собрать LIFE APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
